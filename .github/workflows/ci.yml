name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble & test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages: ''` is required: the action's default is the obsolete `tools` package, which was
      # removed from the SDK repository ("Warning: Failed to find package 'tools'" -> exit 1).
      # Everything this build needs (platforms;android-35, build-tools) is already on the runner
      # image, so the action only has to accept the licences.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository tracks both wrappers; make sure the unix one is runnable even if a
      # contributor's git client dropped the executable bit.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A fresh clone must build with no keystore, no .env and no google-services.json —
      # that is exactly what this job proves (issues #24 and #31).
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace -Pksp.use.daemon=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
